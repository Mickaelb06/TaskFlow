# Modèle nginx : les variables ${…} sont remplacées au démarrage (image nginx, dossier templates).
# Docker Compose : valeurs par défaut du Dockerfile. Railway : PORT fourni, API_UPSTREAM = api.railway.internal:8000.
server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;  # pièces jointes de la messagerie (5 Mo par fichier, 3 par message)
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /api/ {
    # résolution à chaque requête (l'adresse privée de l'API change à chaque déploiement)
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
