name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [rust, python]   # l'application doit fonctionner avec le moteur Rust ET avec la version de référence
    env:
      TASKFLOW_PLANNING_BACKEND: ${{ matrix.engine }}
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow, POSTGRES_DB: taskflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Module Rust (tests Rust + compilation)
        if: matrix.engine == 'rust'
        run: |
          rustup toolchain install stable --profile minimal
          pip install maturin
          (cd planning_rs && cargo test --lib)
          maturin build --release -m planning_rs/Cargo.toml -o dist
          pip install dist/*.whl
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  e2e:
    # Parcours complets dans un vrai navigateur (Firefox headless, préinstallé sur les machines GitHub).
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt selenium
      - name: Tests de bout en bout
        env:
          FIREFOX_BIN: /usr/bin/firefox
          TASKFLOW_PLANNING_BACKEND: python
        run: |
          mkdir -p backend/.venv/bin && ln -sf "$(which python)" backend/.venv/bin/python
          ./test-e2e.sh
