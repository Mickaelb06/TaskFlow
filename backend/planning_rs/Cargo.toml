[package]
name = "taskflow_planning"
version = "0.1.0"
edition = "2024"
description = "Moteur de planification de TaskFlow : chemin critique, cascade des dépendances, prévision de fin"
license = "MIT"
publish = false

[lib]
name = "taskflow_planning"
crate-type = ["cdylib", "rlib"]  # cdylib = module Python ; rlib = tests Rust

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
